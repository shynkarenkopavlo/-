<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniIDE — онлайн-редактор кода: Python, JavaScript, HTML</title>
<style>
:root{
  --bg:#eef1f7;--panel:#ffffff;--panel2:#f6f8fc;--text:#1b2233;--muted:#6d7790;--line:#e1e6f0;
  --accent:#6c5ce7;--accent2:#00b4d8;--err:#d63c3c;--code:#fbfcff;--shadow:0 30px 80px -20px rgba(40,50,100,.28),0 8px 24px -8px rgba(40,50,100,.15);
  --hover:#eef1fa;--ok:#18a05e;
}
:root[data-theme="dark"]{
  --bg:#0c0f1a;--panel:#151a29;--panel2:#10141f;--text:#e8ecf7;--muted:#8a95b2;--line:#252c42;
  --accent:#8b7bff;--accent2:#22d3ee;--err:#ff7b72;--code:#111624;--shadow:0 30px 90px -20px rgba(0,0,0,.7),0 8px 24px -8px rgba(0,0,0,.5);
  --hover:#1d2438;--ok:#2fd27f;
}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  color:var(--text);font:14.5px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(900px 500px at 12% 8%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),
    radial-gradient(800px 500px at 90% 92%,color-mix(in srgb,var(--accent2) 20%,transparent),transparent 60%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;padding:16px;
  transition:background .3s;
}
/* ---------- карточка приложения: ~74% ширины экрана ---------- */
.app{
  position:relative;
  width:min(100%,max(74vw,1000px));
  height:min(88vh,940px);min-height:520px;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
}
@media (max-width:900px){body{padding:0}.app{width:100%;height:100vh;border-radius:0;border:0}}

/* ---------- шапка ---------- */
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2))}
.brand{display:flex;align-items:center;gap:10px;margin-right:10px;user-select:none}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 6px 16px -4px color-mix(in srgb,var(--accent) 60%,transparent)}
.logo svg{display:block}
.brand b{font-size:19px;letter-spacing:-.02em;font-weight:750;line-height:1}
.brand b span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-top:3px;font-weight:500}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.lt{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:9px;cursor:pointer;font:inherit;font-weight:550;transition:.15s}
.lt:hover{color:var(--text)}
.lt.on{background:var(--panel);color:var(--text);box-shadow:0 2px 8px -2px rgba(30,40,90,.25)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.python{background:linear-gradient(135deg,#3776ab 50%,#ffd43b 50%)}.dot.js{background:#f7df1e}.dot.html{background:#e44d26}
.sp{flex:1}
.btn{display:flex;align-items:center;gap:7px;background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:7px 13px;border-radius:10px;cursor:pointer;font:inherit;font-weight:550;transition:.15s}
.btn:hover{background:var(--hover);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.btn.icon{padding:7px 10px}
.btn.stop{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,var(--line))}
.run{display:flex;align-items:center;gap:8px;border:0;color:#fff;font:inherit;font-weight:650;padding:9px 20px;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,#19b86b,#0f9d58);box-shadow:0 8px 20px -6px rgba(25,184,107,.6);transition:.15s}
.run:hover{transform:translateY(-1px);box-shadow:0 12px 24px -6px rgba(25,184,107,.7)}
.run:active{transform:translateY(0);filter:brightness(.95)}

/* ---------- тело: сайдбар | редактор | вывод ---------- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr)}}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel2);border-right:1px solid var(--line)}
.sh{padding:14px 14px 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650;display:flex;justify-content:space-between;align-items:center}
#files{flex:1;min-height:0;overflow:auto;padding:4px 8px}
.fi{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--muted);transition:.12s;margin-bottom:2px;border:1px solid transparent}
.fi:hover{background:var(--hover);color:var(--text)}
.fi.on{background:var(--panel);color:var(--text);border-color:var(--line);box-shadow:0 2px 8px -3px rgba(30,40,90,.2)}
.fi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.fi .x{opacity:0;font-weight:400;padding:0 5px;border-radius:5px;color:var(--muted);line-height:1.2}
.fi:hover .x,.fi.on .x{opacity:1}
.fi .x:hover{background:var(--line);color:var(--err)}
.ico{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:8.5px;font-weight:800;letter-spacing:.02em;color:#fff;background:#8a95b2}
.ico.py{background:linear-gradient(135deg,#3776ab,#2b5d8a)}.ico.js{background:#f7df1e;color:#222}.ico.html,.ico.htm{background:#e44d26}.ico.css{background:#2965f1}.ico.json{background:#8a95b2}.ico.md{background:#444}
.rnw{flex:1;min-width:0;display:flex;align-items:center}
.rnw input.ren{width:auto;flex:1;min-width:0}
.sfx{color:var(--muted);font-weight:600;pointer-events:none;user-select:none}
input.ren{width:100%;font:inherit;border:1px solid var(--accent);border-radius:6px;background:var(--panel);color:var(--text);padding:0 5px;outline:0}
.sbtns{padding:10px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.sbtns .btn{justify-content:center;width:100%;font-size:13px}
.sbtns .btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}
.types{display:none;gap:6px}.types.show{display:flex}
.sbtns .types .btn{flex:1;width:auto;padding:6px 4px;font-size:12px;font-weight:750}
.types .t-html:hover{border-color:#e44d26;color:#e44d26}.types .t-css:hover{border-color:#2965f1;color:#2965f1}.types .t-js:hover{border-color:#c9b400;color:#c9b400}
@media (max-width:900px){
  aside{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .sh{display:none}#files{display:flex;gap:4px;overflow-x:auto;padding:8px;flex:1}.fi{margin:0;white-space:nowrap}
  .sbtns{flex-direction:row;border-top:0;padding:8px}.sbtns .btn{width:auto}
}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane + .pane{border-left:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px;height:40px;border-bottom:1px solid var(--line);background:var(--panel2)}
.cur{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.hint{font-size:11.5px;color:var(--muted)}
kbd{font:inherit;font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel);color:var(--muted)}
.ed{flex:1;min-height:0;position:relative}
#ace{position:absolute;inset:0}
/* вкладки вывода */
.otabs{padding:0 8px 0 10px;gap:2px}
.ot{height:100%;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:0 12px;font:inherit;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.15s}
.ot:hover{color:var(--text)}
.ot.on{color:var(--text);border-bottom-color:var(--accent)}
#pc{display:inline-block;min-width:18px;text-align:center;border-radius:9px;background:var(--line);color:var(--text);font-size:10.5px;padding:0 5px;margin-left:4px}
#pc.bad{background:var(--err);color:#fff}
#stat{font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:2px 10px;border-radius:99px;white-space:nowrap}
#termwrap,#probs{flex:1;min-height:0;overflow:auto;background:var(--code);padding:14px 16px;font:13.5px/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
#termwrap{cursor:text}
#probs{display:none}
.pi{padding:7px 9px;border-radius:8px;cursor:pointer;display:flex;gap:9px}
.pi:hover{background:var(--hover)}
.pi i{color:var(--err);font-style:normal}
.pnone{color:var(--muted)}
#out{white-space:pre-wrap;word-break:break-word}
#out:empty::before{content:'Нажмите «Запустить» — результат появится здесь';color:var(--muted);font-style:italic}
#out .e{color:var(--err)}#out .m{color:var(--muted)}
#row{display:flex;align-items:baseline}
#ps{color:var(--accent);white-space:pre;font-weight:700}
#ti{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:0}
#frame{flex:1;border:0;background:#fff;display:none;width:100%}

/* ---------- уведомления ---------- */
#toast{position:absolute;right:16px;bottom:42px;width:min(380px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
#toast .tw{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:10px 8px 10px 14px;border-radius:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;line-height:1.45;animation:tin .2s ease}
#toast .tw span{flex:1}
#toast .tw.err{border-color:var(--err)}
#toast .tx{flex:none;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 6px;border-radius:6px}
#toast .tx:hover{background:var(--hover);color:var(--text)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* окно подсказок автодополнения */
.ace_editor.ace_autocomplete{border:1px solid var(--line)!important;border-radius:10px;box-shadow:var(--shadow);font-size:13px}
.ace_tooltip.ace_doc-tooltip{border-radius:8px;font-size:12px}

/* ---------- статус-бар ---------- */
footer{display:flex;justify-content:space-between;align-items:center;padding:5px 16px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel))}
footer span b{color:var(--text);font-weight:600}
.ok{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 8px var(--ok)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M13.5 5l-3 14"/></svg></div>
      <div><b>Uni<span>IDE</span></b><small>PYTHON · JAVASCRIPT · HTML</small></div>
    </div>
    <div class="seg" id="langs">
      <button class="lt on" data-l="python"><i class="dot python"></i>Python</button>
      <button class="lt" data-l="js"><i class="dot js"></i>JavaScript</button>
      <button class="lt" data-l="html"><i class="dot html"></i>HTML</button>
    </div>
    <span class="sp"></span>
    <button class="btn" id="clr">Очистить</button>
    <button class="btn icon" id="theme" title="Сменить тему">🌙</button>
    <button class="btn stop" id="stop" style="display:none">■ Стоп</button>
    <button class="run" id="run"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M6 4l14 8-14 8z"/></svg>Запустить</button>
  </header>

  <div class="body">
    <aside>
      <div class="sh"><span id="shl">Проект · Python</span></div>
      <div id="files"></div>
      <div class="sbtns">
        <button class="btn pri" id="addf">＋ Новый файл</button>
        <div class="types" id="types">
          <button class="btn t-html" data-x="html">HTML</button>
          <button class="btn t-css" data-x="css">CSS</button>
          <button class="btn t-js" data-x="js">JS</button>
        </div>
        <button class="btn" id="dl">⬇ Скачать файл</button>
        <button class="btn" id="rst">↺ Сбросить проект</button>
      </div>
    </aside>

    <section class="pane">
      <div class="top"><div class="cur"><span class="ico" id="curico">PY</span><span id="curname">main.py</span></div><span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> — запуск</span></div>
      <div class="ed"><div id="ace"></div></div>
    </section>

    <section class="pane">
      <div class="top otabs">
        <div style="height:100%;display:flex">
          <button class="ot on" id="otmain" data-t="main">Терминал</button>
          <button class="ot" id="otprobs" data-t="probs">Проблемы <span id="pc">0</span></button>
        </div>
        <span id="stat"></span>
      </div>
      <div id="termwrap">
        <div id="out"></div>
        <div id="row"><span id="ps"></span><input id="ti" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" disabled></div>
      </div>
      <div id="probs"></div>
      <iframe id="frame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
    </section>
  </div>

  <div id="toast"></div>
  <footer>
    <span><i class="ok"></i><b id="sblang">Python</b> · <span id="sbpos">Стр 1, Стлб 1</span> · UTF-8</span>
    <span id="sbsave">UniIDE · онлайн-редактор кода</span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.9/ace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.9/ext-language_tools.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var out=$('out'),frame=$('frame'),ti=$('ti'),ps=$('ps'),wrap=$('termwrap'),probsEl=$('probs');
var LANG_NAMES={python:'Python',js:'JavaScript',html:'HTML'};

/* ---------- файлы проекта ---------- */
var LANGS={
 python:{ext:'py',files:[{name:'main.py',code:'name = input("Как вас зовут? ")\nprint("Привет, " + name + "!")\n\nn = int(input("Введите число: "))\nfor i in range(1, n + 1):\n    print(i, "в квадрате =", i * i)\n'}]},
 js:{ext:'js',files:[{name:'script.js',code:'const nums = [1, 2, 3, 4, 5];\nconsole.log("Квадраты:", nums.map(n => n * n));\nconsole.log("Сумма:", nums.reduce((a, b) => a + b, 0));\n'}]},
 html:{ext:'css',files:[
  {name:'index.html',code:'<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="utf-8">\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1 id="t">Привет, мир!</h1>\n  <button id="b">Нажми меня</button>\n  <script src="script.js"><\/script>\n</body>\n</html>\n'},
  {name:'style.css',code:'body { font-family: sans-serif; text-align: center; padding: 40px; }\nbutton { padding: 10px 20px; font-size: 16px; }\n'},
  {name:'script.js',code:'document.getElementById("b").onclick = function () {\n  document.getElementById("t").textContent = "Работает!";\n};\n'}
 ]}
};
var DEFAULTS=JSON.parse(JSON.stringify(LANGS)),KEY='uniide:projects:v1';
var active={python:0,js:0,html:0},lang='python',outTab='main';
var MODES={py:'python',js:'javascript',html:'html',htm:'html',css:'css',json:'json',md:'markdown',txt:'text'};
function extOf(n){return n.split('.').pop().toLowerCase()}
function modeFor(n){return 'ace/mode/'+(MODES[extOf(n)]||'text')}
function sess(f){if(!f.sess){f.sess=ace.createEditSession(f.code,modeFor(f.name));f.sess.setTabSize(4);f.sess.setUseSoftTabs(true)}return f.sess}
function fileCode(f){return f.sess?f.sess.getValue():f.code}
function curFile(){return LANGS[lang].files[active[lang]]}

/* ---------- тема ---------- */
var theme=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
var aceEd=ace.edit('ace');
aceEd.setOptions({showLineNumbers:true,showGutter:true,highlightActiveLine:true,showPrintMargin:false,fontSize:14});
aceEd.commands.addCommand({name:'run',bindKey:{win:'Ctrl-Enter',mac:'Command-Enter'},exec:function(){run()}});
function setTheme(t){
  theme=t;document.documentElement.dataset.theme=t;
  aceEd.setTheme(t==='dark'?'ace/theme/tomorrow_night':'ace/theme/chrome');
  $('theme').textContent=t==='dark'?'☀️':'🌙';
}
$('theme').onclick=function(){setTheme(theme==='dark'?'light':'dark');scheduleSave()};
setTheme(theme);

/* ---------- сохранение проектов на этом устройстве (localStorage) ---------- */
var saveT=null;
function saveState(){
  try{
    var o={v:1,lang:lang,theme:theme,active:active,langs:{}};
    Object.keys(LANGS).forEach(function(l){o.langs[l]=LANGS[l].files.map(function(f){return {name:f.name,code:fileCode(f)}})});
    localStorage.setItem(KEY,JSON.stringify(o));
    $('sbsave').textContent='Сохранено на устройстве · '+new Date().toTimeString().slice(0,8);
  }catch(e){$('sbsave').textContent='Автосохранение недоступно в этом окружении'}
}
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(saveState,400)}
function loadState(){
  try{
    var raw=localStorage.getItem(KEY);if(!raw)return;
    var o=JSON.parse(raw);if(!o||o.v!==1)return;
    ['python','js','html'].forEach(function(l){
      var a=o.langs&&o.langs[l];
      if(Array.isArray(a)&&a.length&&a.every(function(f){return f&&typeof f.name==='string'&&typeof f.code==='string'}))
        LANGS[l].files=a.map(function(f){return {name:f.name,code:f.code}});
      var i=o.active&&o.active[l];
      active[l]=(typeof i==='number'&&i>=0&&i<LANGS[l].files.length)?i:0;
    });
    if(o.lang==='python'||o.lang==='js'||o.lang==='html')lang=o.lang;
    if(o.theme==='dark'||o.theme==='light')setTheme(o.theme);
    document.querySelectorAll('#langs .lt').forEach(function(x){x.classList.toggle('on',x.dataset.l===lang)});
  }catch(e){}
}
aceEd.on('change',scheduleSave);
window.addEventListener('beforeunload',function(){saveState()});

/* ---------- автодополнение: подсказки при наборе, Tab — принять первую ---------- */
(function(){
  var lt;try{lt=ace.require('ace/ext/language_tools')}catch(e){return}
  if(!lt)return;
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function item(cap,snip,meta,doc,score){
    var o={caption:cap,value:cap,meta:meta,score:score||1000,docHTML:'<b>'+esc(cap)+'</b>'+(doc?'<br>'+esc(doc):'')};
    if(snip)o.snippet=snip;
    return o;
  }
  /* список имён через пробел; «=имя» — свойство/константа без скобок */
  function mem(names,meta,sc){
    return names.split(' ').map(function(n){var c=n.charAt(0)==='=';if(c)n=n.slice(1);return item(n,c?null:n+'(${1})',meta,'',sc)});
  }
  function rows(list,meta,sc){return list.map(function(r){return item(r[0],r[1],r[3]||meta,r[2],sc)})}
  function words(str,meta,sc){return str.split(' ').map(function(w){return item(w,null,meta,'',sc)})}
  function uniq(arr){var s={};return arr.filter(function(x){return s[x.caption]?false:(s[x.caption]=1)})}

  /* ===== Python ===== */
  var PY_FN=rows([
    ['print','print(${1})','вывести значения в терминал'],['input','input(${1:"Введите: "})','запросить ввод у пользователя'],
    ['len','len(${1})','длина строки, списка и т. п.'],['range','range(${1})','последовательность чисел'],
    ['int','int(${1})','преобразовать в целое число'],['str','str(${1})','преобразовать в строку'],
    ['float','float(${1})','преобразовать в дробное число'],['list','list(${1})','создать список'],
    ['dict','dict(${1})','создать словарь'],['set','set(${1})','создать множество'],['tuple','tuple(${1})','создать кортеж'],
    ['bool','bool(${1})','логическое значение'],['type','type(${1})','тип значения'],
    ['isinstance','isinstance(${1:x}, ${2:int})','проверить тип'],['sum','sum(${1})','сумма элементов'],

function openFile(i){active[lang]=i;aceEd.setSession(sess(curFile()));renderTabs();annotate();updPos();aceEd.focus()}
function addFile(ext){
  var L=LANGS[lang],n=1,name;ext=ext||L.ext;
  do{name='file'+(n++)+'.'+ext}while(L.files.some(function(f){return f.name===name}));
  L.files.push({name:name,code:''});
  var i=L.files.length-1;openFile(i);
  var el=$('files').children[i],nm=el&&el.querySelector('.nm');
  if(nm)rename(i,nm);
}
function closeFile(i){
  var L=LANGS[lang];if(L.files.length<2)return;
  problems=problems.filter(function(p){return p.file!==L.files[i].name});
  L.files.splice(i,1);
  if(active[lang]>=L.files.length)active[lang]=L.files.length-1;
  else if(i<active[lang])active[lang]--;
  renderProbs();openFile(active[lang]);
}
function rename(i,span){
  var f=LANGS[lang].files[i],inp=document.createElement('input'),done=false;
  /* в Python и JavaScript расширение (.py / .js) подставляется автоматически; в HTML имя вводится целиком */
  var auto=(lang==='python'||lang==='js')?LANGS[lang].ext:null;
  var tail=auto?'.'+auto:'';
  var hasTail=function(n){return !!tail&&n.toLowerCase().slice(-tail.length)===tail};
  var base=f.name;if(hasTail(base))base=base.slice(0,-tail.length);
  var box=document.createElement('span');box.className='rnw';
  inp.value=base;inp.className='ren';box.appendChild(inp);
  if(auto){var sf=document.createElement('span');sf.className='sfx';sf.textContent=tail;box.appendChild(sf)}
  span.replaceWith(box);inp.focus();inp.select();
  function fin(ok){
    if(done)return;done=true;
    var n=inp.value.trim().replace(/[\\\/]/g,'');
    if(auto&&n){if(n.toLowerCase()===tail)n='';else if(!hasTail(n))n+=tail}
    if(ok&&n&&!LANGS[lang].files.some(function(g,j){return j!==i&&g.name===n})){f.name=n;if(f.sess)f.sess.setMode(modeFor(n))}
    renderTabs();
  }
  inp.onblur=function(){fin(true)};
  inp.onkeydown=function(e){if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false)};
}
function download(){
  var f=curFile(),b=new Blob([fileCode(f)],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}

var problems=[];

function lastNum(re,s){var m,r=null,g=new RegExp(re.source,'g');while((m=g.exec(s)))r=+m[1];return r}

var mode='loading',pending=null,hist=[],hi=0,engine=null,pyLoading=false,runFile='';
var LIMIT=2*1024*1024,outBytes=0,halted=false,lastSpan=null,lastCls='',enc=new TextEncoder(),scrollQ=false;
function clearOut(){out.innerHTML='';lastSpan=null;outBytes=0;halted=false}
function write(s,c){
  if(halted||s==='')return;
  c=c||'';
  outBytes+=enc.encode(s).length;
  if(outBytes>LIMIT){forceLimit()}else if(lastSpan&&lastCls===c){lastSpan.firstChild.appendData(s)}
  else{var sp=document.createElement('span');if(c)sp.className=c;sp.textContent=s;out.appendChild(sp);lastSpan=sp;lastCls=c}
  if(!scrollQ){scrollQ=true;requestAnimationFrame(function(){scrollQ=false;wrap.scrollTop=wrap.scrollHeight})}
}
function notify(msg,kind){
  try{console[kind==='e'?'warn':'info']('[UniIDE] '+msg)}catch(e){}
  var box=$('toast');
  for(var k=0;k<box.children.length;k++)if(box.children[k].firstChild.textContent===msg)return;
  var it=document.createElement('div');it.className='tw'+(kind==='e'?' err':'');
  var tx=document.createElement('span');tx.textContent=msg;
  var x=document.createElement('button');x.className='tx';x.textContent='×';x.title='Закрыть';x.setAttribute('aria-label','Закрыть');
  x.onclick=function(){it.remove()};
  it.appendChild(tx);it.appendChild(x);box.appendChild(it);
  while(box.children.length>4)box.removeChild(box.firstChild);
}
function stopIfHalted(){if(halted)throw new Error('OUTPUT_LIMIT')}
function print(s,c){write(s+'\n',c)}
function fmt(v){if(typeof v==='string')return v;try{return typeof v==='object'?JSON.stringify(v):String(v)}catch(e){return String(v)}}
var STAT={loading:'загрузка Python…',running:'выполняется…',input:'ожидание ввода',idle:'готово',failed:'Python не загружен'};
function refreshStat(){
  if(lang!=='python'){$('stat').textContent='JS · браузер';return}
  var t=STAT[mode];
  if(engine==='pyodide')t+=' · Pyodide';
  else if(engine==='skulpt')t+=' · Skulpt'+(pyLoading?' (Pyodide грузится…)':'');
  $('stat').textContent=t;

function setMode(m){
  mode=m;ti.disabled=(m!=='idle'&&m!=='input');
  if(m!=='input')ps.textContent=(m==='idle')?'>>> ':'';
  refreshStat();
  if(m==='idle'||m==='input')ti.focus({preventScroll:true});
}
wrap.addEventListener('click',function(){if(!ti.disabled)ti.focus()});
ti.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    var t=ti.value;ti.value='';
    if(mode==='input'&&pending){print(pending.p+t);var r=pending.res;pending=null;ps.textContent='';setMode('running');r(t)}
    else if(mode==='idle'){if(halted)clearOut();print('>>> '+t,'m');if(t.trim()){hist.push(t);hi=hist.length;if(engine==='pyodide')execPy(t,true);else execSk(t,true)}}
  }else if(e.key==='Escape'&&mode==='input'&&pending){
    var q=pending;pending=null;ps.textContent='';setMode('running');q.rej(new Error('EOFError: ввод прерван'));
  }else if(e.key==='ArrowUp'&&mode==='idle'){e.preventDefault();if(hi>0){hi--;ti.value=hist[hi]}}
  else if(e.key==='ArrowDown'&&mode==='idle'){e.preventDefault();if(hi<hist.length-1){hi++;ti.value=hist[hi]}else{hi=hist.length;ti.value=''}}
});
function ainput(p){
  return new Promise(function(res,rej){
    p=p==null?'':String(p);pending={res:res,rej:rej,p:p};
    mode='input';ps.textContent=p;ti.disabled=false;ti.focus();refreshStat();
  });
}
function timeout(p,ms,msg){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error(msg))},ms)})])}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('не удалось скачать '+src))};document.head.appendChild(s)})}

/* ---------- Web Workers: код выполняется отдельно от страницы ---------- */
var WORKERS=null,loadedScripts={};
function probeWorkers(){
  return new Promise(function(res){
    try{
      var w=new Worker(URL.createObjectURL(new Blob(['onmessage=function(){postMessage(1)}'],{type:'text/javascript'})));
      var t=setTimeout(function(){w.terminate();res(false)},2500);
      w.onmessage=function(){clearTimeout(t);w.terminate();res(true)};
      w.onerror=function(){clearTimeout(t);w.terminate();res(false)};
      w.postMessage(0);
    }catch(e){res(false)}
  });
}
function loadOnce(u){return loadedScripts[u]||(loadedScripts[u]=loadScript(u).catch(function(e){delete loadedScripts[u];throw e}))}
/* режим совместимости: тот же код «воркера», но внутри страницы (если Web Worker заблокированы) */
function fakeWorker(fn){
  var fw={dead:false,throwOnDead:false,onmessage:null,onerror:null},S={};
  function importScripts(){
    var urls=[].slice.call(arguments);
    return urls.reduce(function(p,u){return p.then(function(){return loadOnce(u)})},Promise.resolve());
  }
  function post(m){
    if(fw.dead){if(fw.throwOnDead){fw.throwOnDead=false;throw new Error('OUTPUT_LIMIT')}return}
    if(fw.onmessage)fw.onmessage({data:m});
    if(fw.dead&&fw.throwOnDead){fw.throwOnDead=false;throw new Error('OUTPUT_LIMIT')}
  }
  new Function('self','postMessage','importScripts','('+fn.toString()+')()')(S,post,importScripts);
  fw.postMessage=function(m){setTimeout(function(){
    if(fw.dead||!S.onmessage)return;
    try{var r=S.onmessage({data:m});if(r&&r.catch)r.catch(function(){})}catch(e){}
  },0)};
  fw.terminate=function(){fw.dead=true};
  fw.abortRun=function(){fw.throwOnDead=true};
  return fw;
}
function spawn(fn){
  if(WORKERS!==false){
    try{return new Worker(URL.createObjectURL(new Blob(['('+fn.toString()+')()'],{type:'text/javascript'})))}
    catch(e){WORKERS=false}
  }
  return fakeWorker(fn);
}

function jsWorkerFn(){
  var buf='',cls='',last=Date.now();
  function flush(){if(buf){postMessage({t:'out',s:buf,c:cls});buf=''}last=Date.now()}
  function out(s,c){c=c||'';out.total=(out.total||0)+(out.te||(out.te=new TextEncoder())).encode(s).length;if(out.total>2097152){if(!out.hit){out.hit=true;flush();postMessage({t:'limit'})}throw new Error('OUTPUT_LIMIT')}if(c!==cls){flush();cls=c}buf+=s;if(buf.length>4096||Date.now()-last>30)flush()}
  function fmt(v){if(typeof v==='string')return v;try{return typeof v==='object'?JSON.stringify(v):String(v)}catch(e){return String(v)}}
  self.onmessage=function(e){
    var d=e.data;if(d.t!=='run')return;out.total=0;out.hit=false;
    var j=function(a){return [].map.call(a,fmt).join(' ')+'\n'};
    var c={log:function(){out(j(arguments))},warn:function(){out(j(arguments),'e')},error:function(){out(j(arguments),'e')}};
    c.info=c.log;
    (async function(){
      try{
        var AF=Object.getPrototypeOf(async function(){}).constructor;
        var r=await new AF('console',d.src)(c);
        if(r!==undefined)out('→ '+fmt(r)+'\n','m');
        flush();
      }catch(err){
        flush();
        var m=/<anonymous>:(\d+):\d+/.exec(String(err&&err.stack||''));
        postMessage({t:'err',m:String(err),line:m?Math.max(1,+m[1]-2):null});
      }
      postMessage({t:'done'});
    })();
  };
}

function skWorkerFn(){
  var buf='',cls='',last=Date.now(),inputCb=null;
  function flush(){if(buf){postMessage({t:'out',s:buf,c:cls});buf=''}last=Date.now()}
  function out(s,c){c=c||'';out.total=(out.total||0)+(out.te||(out.te=new TextEncoder())).encode(s).length;if(out.total>2097152){if(!out.hit){out.hit=true;flush();postMessage({t:'limit'})}throw new Error('OUTPUT_LIMIT')}if(c!==cls){flush();cls=c}buf+=s;if(buf.length>4096||Date.now()-last>30)flush()}
  self.onmessage=async function(e){
    var d=e.data;
    if(d.t==='input'){if(inputCb)inputCb.res(d.v);inputCb=null;return}
    if(d.t==='eof'){if(inputCb)inputCb.rej(new Error('EOFError: ввод прерван'));inputCb=null;return}
    if(d.t==='ping'){
      try{await importScripts(d.libs[0],d.libs[1]);postMessage({t:'ready'})}
      catch(err){postMessage({t:'fail',m:String(err&&err.message||err)})}
      return;
    }
    if(d.t==='run'){
      out.total=0;out.hit=false;
      try{await importScripts(d.libs[0],d.libs[1])}
      catch(err){postMessage({t:'err',m:'Не удалось загрузить Skulpt: '+err,line:null});postMessage({t:'done'});return}
      d.files.forEach(function(f){Sk.builtinFiles.files['src/lib/'+f.name]=f.code});
      Sk.configure({
        output:function(s){out(s,'')},
        read:function(x){if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[x]===undefined)throw "File not found: '"+x+"'";return Sk.builtinFiles.files[x]},
        inputfun:function(p){flush();return new Promise(function(res,rej){inputCb={res:res,rej:rej};postMessage({t:'input',p:String(p==null?'':p)})})},
        inputfunTakesPrompt:true,__future__:Sk.python3
      });
      Sk.misceval.asyncToPromise(function(){return Sk.importMainWithBody('<stdin>',false,d.src,true)}).then(
        function(){flush();postMessage({t:'done'})},
        function(err){
          flush();var m=String(err&&err.toString?err.toString():err),mm=/on line (\d+)/.exec(m);
          postMessage({t:'err',m:m,line:mm?+mm[1]:null});postMessage({t:'done'});
        });
    }
  };
}

function pyWorkerFn(){
  var py=null,ns=null,tr=null,rp=null,inputCb=null,buf='',cls='',last=Date.now();
  function flush(){if(buf){postMessage({t:'out',s:buf,c:cls});buf=''}last=Date.now()}
  function out(s,c){c=c||'';out.total=(out.total||0)+(out.te||(out.te=new TextEncoder())).encode(s).length;if(out.total>2097152){if(!out.hit){out.hit=true;flush();postMessage({t:'limit'})}throw new Error('OUTPUT_LIMIT')}if(c!==cls){flush();cls=c}buf+=s;if(buf.length>4096||Date.now()-last>30)flush()}
  function clean(m){
    var L=String(m).split('\n'),i=L.findIndex(function(l){return l.indexOf('"<exec>"')>-1});
    if(i>-1)return 'Traceback (most recent call last):\n'+L.slice(i).join('\n');
    return L.filter(Boolean).slice(-3).join('\n');
  }
  function lastNum(s){var m,r=null,g=/line (\d+)/g;while((m=g.exec(s)))r=+m[1];return r}
  function newNs(){if(ns)ns.destroy();ns=py.runPython('{"__name__": "__main__"}')}
  async function run(d){
    out.total=0;out.hit=false;
    try{
      if(!d.repl){
        newNs();
        d.files.forEach(function(f){py.FS.writeFile('/home/pyodide/'+f.name,f.code)});
        py.runPython('import sys, importlib\nimportlib.invalidate_caches()\nfor m in '+JSON.stringify(d.files.map(function(f){return f.name.replace(/\.py$/i,'')}))+':\n    sys.modules.pop(m, None)');
      }
      var r=await py.runPythonAsync(tr(d.src),{globals:ns});
      if(d.repl&&r!==undefined)out(String(rp(r))+'\n','');
      flush();
    }catch(err){
      flush();var m=clean(err&&err.message||err);
      postMessage({t:'err',m:m,line:d.repl?null:lastNum(m)});
    }
    flush();postMessage({t:'done'});
  }
  self.onmessage=async function(e){
    var d=e.data;
    if(d.t==='input'){if(inputCb)inputCb.res(d.v);inputCb=null;return}
    if(d.t==='eof'){if(inputCb)inputCb.rej(new Error('EOFError: ввод прерван'));inputCb=null;return}
    if(d.t==='run'){run(d);return}
    if(d.t==='init'){
      try{
        importScripts(d.base+'pyodide.js');
        py=await loadPyodide({indexURL:d.base});
        py.setStdout({batched:function(s){out(s+'\n','')}});
        py.setStderr({batched:function(s){out(s+'\n','e')}});
        py.registerJsModule('jsio',{ainput:function(p){
          flush();
          return new Promise(function(res,rej){inputCb={res:res,rej:rej};postMessage({t:'input',p:String(p==null?'':p)})});
        }});
        py.runPython(d.helper);
        tr=py.globals.get('_tr_');rp=py.runPython('repr');newNs();
        postMessage({t:'ready',v:py.runPython('import sys\nsys.version.split()[0]')});
      }catch(err){postMessage({t:'fail',m:String(err&&err.message||err)})}
    }
  };
}

/* ---------- запуск воркера, «Стоп», лимит вывода ---------- */
var job=null,skIdx=0,skOk=false,skFake=false,pyW=null,pyVer='';
function updateStop(){$('stop').style.display=job?'flex':'none'}
function attach(w,kind,repl){
  return new Promise(function(resolve){
    var fin=false;
    function done(){
      if(fin)return;fin=true;
      if(kind!=='pyodide')w.terminate();
      job=null;updateStop();resolve();
    }
    job={w:w,kind:kind,done:done};updateStop();
    w.onmessage=function(e){
      var d=e.data;
      if(d.t==='out'){write(d.s,d.c);if(halted)onLimit()}
      else if(d.t==='limit'){forceLimit();onLimit()}
      else if(d.t==='input'){ainput(d.p).then(function(v){w.postMessage({t:'input',v:v})},function(){w.postMessage({t:'eof'})})}
      else if(d.t==='err'){if(!halted){print(d.m,'e');if(!repl)addProblem(d.m,d.line)}}
      else if(d.t==='done')done();
    };
    w.onerror=function(ev){if(!halted)print('Ошибка воркера: '+(ev.message||'неизвестная'),'e');done()};
  });
}
function forceLimit(){
  if(halted)return;
  halted=true;
  var n=document.createElement('span');n.className='e';n.textContent='\n⛔ Вывод превысил 2 МБ — выполнение остановлено.\n';
  out.appendChild(n);lastSpan=null;
  addProblem('Вывод превысил 2 МБ — выполнение остановлено');
}
/* Skulpt/JS: воркер одноразовый — завершаем сразу. Pyodide: даём коду 3 с остановиться самому (без перезагрузки), иначе завершаем. */
function onLimit(){
  var j=job;if(!j)return;
  if(j.kind!=='pyodide'){kill('limit');return}
  if(!j.wd)j.wd=setTimeout(function(){if(job===j)kill('limit')},3000);
}
function kill(reason){
  if(!job)return;var j=job;
  if(j.w.abortRun)j.w.abortRun();
  j.w.terminate();
  if(reason==='stop')print('\n⛔ Выполнение остановлено.','e');
  if(j.kind==='pyodide'){
    pyW=null;engine=skOk?'skulpt':null;
    setTimeout(function(){notify('Pyodide перезапускается (переменные REPL сброшены)…');initPyodide()},50);
  }
  j.done();
}
$('stop').onclick=function(){kill('stop')};
function filesPayload(){return otherPyFiles().map(function(f){return {name:f.name,code:fileCode(f)}})}

/* ---------- Skulpt (лёгкий Python, быстрый старт) ---------- */
var SK_SRC=[
 ['https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt.min.js','https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt-stdlib.js'],
 ['https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js','https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js']
];
function pingSk(k,fake){
  return new Promise(function(res){
    var w;try{w=fake?fakeWorker(skWorkerFn):spawn(skWorkerFn)}catch(e){return res(false)}
    var t=setTimeout(function(){w.terminate();res(false)},40000);
    w.onmessage=function(e){clearTimeout(t);w.terminate();res(e.data.t==='ready')};
    w.onerror=function(){clearTimeout(t);w.terminate();res(false)};
    w.postMessage({t:'ping',libs:SK_SRC[k]});
  });
}
async function initSkulpt(){
  /* сначала пробуем Skulpt в Web Worker; если библиотека там не стартует — тихо запускаем её внутри страницы */
  for(var k=0;k<SK_SRC.length&&!skOk;k++){
    if(WORKERS!==false&&await pingSk(k,false)){skOk=true;skIdx=k;skFake=false;engine='skulpt'}
    else if(await pingSk(k,true)){skOk=true;skIdx=k;skFake=true;engine='skulpt'}
    else console.warn('Skulpt: не удалось загрузить с '+SK_SRC[k][0].split('/')[2]);
  }
}
async function execSk(src,repl){
  setMode('running');
  var w;
  try{w=skFake?fakeWorker(skWorkerFn):spawn(skWorkerFn)}catch(e){print('Не удалось запустить Skulpt: '+(e&&e.message||e),'e');setMode('idle');return}
  var p=attach(w,'skulpt',repl);
  w.postMessage({t:'run',src:src,libs:SK_SRC[skIdx],files:filesPayload()});
  await p;pending=null;setMode('idle');

/* ---------- Pyodide (полный Python, грузится в фоне, тоже в воркере) ---------- */
var SOURCES=['https://cdn.jsdelivr.net/npm/pyodide@0.26.4/','https://unpkg.com/pyodide@0.26.4/','https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'];
var HELPER=String.raw`
import ast, builtins, jsio
builtins._ainput_ = jsio.ainput
def _no_sync_input(*a):
    raise RuntimeError("input() здесь не поддерживается (например, внутри lambda или __init__). Вызывайте input() на верхнем уровне или в обычной функции.")
builtins.input = _no_sync_input
def _fname(f):
    if isinstance(f, ast.Name): return f.id
    if isinstance(f, ast.Attribute): return f.attr
def _tr_(src):
    tree = ast.parse(src)
    defs = [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name != '__init__']
    fs = set()
    def needs(d):
        for n in ast.walk(d):
            if isinstance(n, ast.Call):
                f = n.func
                if (isinstance(f, ast.Name) and f.id == 'input') or _fname(f) in fs:
                    return True
        return False
    ch = True
    while ch:
        ch = False
        for d in defs:
            if d.name not in fs and needs(d):
                fs.add(d.name); ch = True
    class T(ast.NodeTransformer):
        def visit_Call(self, n):
            self.generic_visit(n)
            f = n.func
            if isinstance(f, ast.Name) and f.id == 'input':
                n.func = ast.Name('_ainput_', ast.Load())
                return ast.Await(n)
            if _fname(f) in fs:
                return ast.Await(n)
            return n
        def visit_FunctionDef(self, n):
            self.generic_visit(n)
            if n.name in fs:
                n.__class__ = ast.AsyncFunctionDef
            return n
    tree = T().visit(tree)
    ast.fix_missing_locations(tree)
    return ast.unparse(tree)

async function wasmOk(){try{await WebAssembly.compile(new Uint8Array([0,97,115,109,1,0,0,0]));return true}catch(e){return false}}
function pyInitFrom(base){
  return new Promise(function(res){
    var w;try{w=spawn(pyWorkerFn)}catch(e){return res(String(e&&e.message||e))}
    var t=setTimeout(function(){w.terminate();res('таймаут загрузки')},180000);
    w.onmessage=function(e){
      var d=e.data;
      if(d.t==='ready'){clearTimeout(t);pyW=w;pyVer=d.v;res(true)}
      else if(d.t==='fail'){clearTimeout(t);w.terminate();res(d.m)}
    };
    w.onerror=function(ev){clearTimeout(t);w.terminate();res(ev.message||'ошибка воркера')};
    w.postMessage({t:'init',base:base,helper:HELPER});
  });
}
async function initPyodide(){
  if(pyLoading)return;
  if(WORKERS===false){
    if(skOk)notify('Pyodide отключён: Web Worker недоступны в этом окружении. Откройте файл напрямую в браузере — тогда подключится полный Python.');
    return;
  }
  pyLoading=true;refreshStat();
  if(!(await wasmOk())){
    if(skOk)notify('Pyodide пропущен: в этом окружении заблокирован WebAssembly (откройте файл напрямую в браузере). Работает Skulpt.');
    pyLoading=false;refreshStat();return;
  }
  var ok=false;
  for(var k=0;k<SOURCES.length&&!ok;k++){
    var r=await pyInitFrom(SOURCES[k]);
    if(r===true)ok=true;
    else if(/wasm|WebAssembly/i.test(String(r)))break;
  }
  if(ok){engine='pyodide';notify('Загружен полный Python '+pyVer+' (Pyodide). REPL теперь запоминает переменные.')}
  else if(skOk)notify('Pyodide не загрузился. Работает облегчённый Python (Skulpt): без numpy/pandas и части модулей.');
  pyLoading=false;refreshStat();
}
async function execPy(src,repl){
  setMode('running');
  var p=attach(pyW,'pyodide',repl);
  pyW.postMessage({t:'run',src:src,repl:!!repl,files:repl?[]:filesPayload()});
  await p;pending=null;setMode('idle');
}

/* ---------- запуск Python ---------- */
var starting=false;
async function startPython(){
  if(starting)return;starting=true;setMode('loading');
  if(WORKERS===null){
    WORKERS=await probeWorkers();
    if(!WORKERS)notify('Режим совместимости: Web Worker заблокированы. Лимит вывода 2 МБ работает, но «Стоп» не прервёт цикл без вывода.');
