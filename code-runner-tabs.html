<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Онлайн-редактор кода: Python, JavaScript, HTML</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1d2330;--muted:#6b7385;--line:#dde1e8;--accent:#2f6df6;--err:#c62828;--code:#fbfcfe;--tabbg:#eceff4}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--panel:#1a1f2a;--text:#e6e9f0;--muted:#8d96aa;--line:#2b3242;--accent:#4d86ff;--err:#ff7b72;--code:#161b25;--tabbg:#141822}}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 12px 0 0;font-weight:650}
.seg{display:flex;gap:4px;align-items:center}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sp{flex:1}
button.run{background:#1f9d55;color:#fff;border:0;padding:8px 18px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
button.run:active{filter:brightness(.9)}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}
/* вкладки файлов */
#ftabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:var(--tabbg);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.ft{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;color:var(--muted);cursor:pointer;font-size:13px;background:transparent}
.ft.on{background:var(--panel);color:var(--text);border-color:var(--line);margin-bottom:-1px;padding-bottom:7px}
.ft b{font-weight:400;color:var(--muted);padding:0 2px;border-radius:4px}
.ft b:hover{background:var(--line);color:var(--text)}
button.ft.add{font-size:16px;padding:4px 10px;border:0}
button.ft.add:hover{color:var(--text)}
.hint{margin-left:auto;margin-right:6px;font-size:11px;color:var(--muted);align-self:center}
input.ren{width:110px;font:inherit;font-size:13px;border:1px solid var(--accent);border-radius:4px;background:var(--panel);color:var(--text);padding:0 4px;outline:0}
.ed{flex:1;min-height:0;position:relative}
#ace{position:absolute;inset:0}
/* вкладки вывода */
#otabs{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:6px 8px 0 8px;background:var(--tabbg);border-bottom:1px solid var(--line)}
.ot{border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.ot.on{background:var(--panel);color:var(--text);border-color:var(--line);margin-bottom:-1px;padding-bottom:7px}
#pc{display:inline-block;min-width:18px;text-align:center;border-radius:9px;background:var(--line);color:var(--text);font-size:11px;padding:0 5px;margin-left:4px}
#pc.bad{background:var(--err);color:#fff}
#stat{font-size:12px;color:var(--muted);padding-bottom:6px}
#termwrap,#probs{flex:1;min-height:0;overflow:auto;background:var(--code);padding:12px 14px;font:14px/1.55 ui-monospace,Menlo,Consolas,monospace}
#termwrap{cursor:text}
#probs{display:none}
.pi{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px}
.pi:hover{background:var(--line)}
.pi i{color:var(--err);font-style:normal}
.pnone{color:var(--muted)}
#out{white-space:pre-wrap;word-break:break-word}
#out .e{color:var(--err)}#out .m{color:var(--muted)}
#row{display:flex;align-items:baseline}
#ps{color:var(--accent);white-space:pre;font-weight:600}
#ti{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:0}
#frame{flex:1;border:0;background:#fff;display:none;width:100%}
</style>
</head>
<body>
<header>
  <h1>Онлайн-редактор кода</h1>
  <div class="seg" id="langs">
    <button class="tab on" data-l="python">Python</button>
    <button class="tab" data-l="js">JavaScript</button>
    <button class="tab" data-l="html">HTML</button>
  </div>
  <span class="sp"></span>
  <button class="ghost" id="clr">Очистить</button>
  <button class="run" id="run">▶ Запустить</button>
</header>
<main>
  <section class="pane">
    <div id="ftabs"></div>
    <div class="ed"><div id="ace"></div></div>
  </section>
  <section class="pane" style="border-right:0">
    <div id="otabs">
      <div>
        <button class="ot on" id="otmain" data-t="main">Терминал</button><button class="ot" id="otprobs" data-t="probs">Проблемы <span id="pc">0</span></button>
      </div>
      <span id="stat"></span>
    </div>
    <div id="termwrap">
      <div id="out"></div>
      <div id="row"><span id="ps"></span><input id="ti" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" disabled></div>
    </div>
    <div id="probs"></div>
    <iframe id="frame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.9/ace.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var out=$('out'),frame=$('frame'),ti=$('ti'),ps=$('ps'),wrap=$('termwrap'),probsEl=$('probs');
var dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;

/* ---------- файлы и вкладки ---------- */
var LANGS={
 python:{ext:'py',files:[{name:'main.py',code:'name = input("Как вас зовут? ")\nprint("Привет, " + name + "!")\n\nn = int(input("Введите число: "))\nfor i in range(1, n + 1):\n    print(i, "в квадрате =", i * i)\n'}]},
 js:{ext:'js',files:[{name:'script.js',code:'const nums = [1, 2, 3, 4, 5];\nconsole.log("Квадраты:", nums.map(n => n * n));\nconsole.log("Сумма:", nums.reduce((a, b) => a + b, 0));\n'}]},
 html:{ext:'css',files:[
  {name:'index.html',code:'<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="utf-8">\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1 id="t">Привет, мир!</h1>\n  <button id="b">Нажми меня</button>\n  <script src="script.js"><\/script>\n</body>\n</html>\n'},
  {name:'style.css',code:'body { font-family: sans-serif; text-align: center; padding: 40px; }\nbutton { padding: 10px 20px; font-size: 16px; }\n'},
  {name:'script.js',code:'document.getElementById("b").onclick = function () {\n  document.getElementById("t").textContent = "Работает!";\n};\n'}
 ]}
};
var active={python:0,js:0,html:0},lang='python',outTab='main';
var MODES={py:'python',js:'javascript',html:'html',htm:'html',css:'css',json:'json',md:'markdown',txt:'text'};
function modeFor(n){return 'ace/mode/'+(MODES[n.split('.').pop().toLowerCase()]||'text')}
function sess(f){if(!f.sess){f.sess=ace.createEditSession(f.code,modeFor(f.name));f.sess.setTabSize(4);f.sess.setUseSoftTabs(true)}return f.sess}
function fileCode(f){return f.sess?f.sess.getValue():f.code}
function curFile(){return LANGS[lang].files[active[lang]]}

var aceEd=ace.edit('ace');
aceEd.setTheme(dark?'ace/theme/tomorrow_night':'ace/theme/chrome');
aceEd.setOptions({showLineNumbers:true,showGutter:true,highlightActiveLine:true,showPrintMargin:false,fontSize:14});
aceEd.commands.addCommand({name:'run',bindKey:{win:'Ctrl-Enter',mac:'Command-Enter'},exec:function(){run()}});

function openFile(i){active[lang]=i;aceEd.setSession(sess(curFile()));renderTabs();annotate();aceEd.focus()}
function addFile(){
  var L=LANGS[lang],n=2,name;
  do{name='file'+(n++)+'.'+L.ext}while(L.files.some(function(f){return f.name===name}));
  L.files.push({name:name,code:''});openFile(L.files.length-1);
}
function closeFile(i){
  var L=LANGS[lang];if(L.files.length<2)return;
  problems=problems.filter(function(p){return p.file!==L.files[i].name});
  L.files.splice(i,1);
  if(active[lang]>=L.files.length)active[lang]=L.files.length-1;
  else if(i<active[lang])active[lang]--;
  renderProbs();openFile(active[lang]);
}
function rename(i,span){
  var f=LANGS[lang].files[i],inp=document.createElement('input'),done=false;
  inp.value=f.name;inp.className='ren';span.replaceWith(inp);inp.focus();inp.select();
  function fin(ok){
    if(done)return;done=true;
    var n=inp.value.trim().replace(/[\\\/]/g,'');
    if(ok&&n&&!LANGS[lang].files.some(function(g,j){return j!==i&&g.name===n})){f.name=n;if(f.sess)f.sess.setMode(modeFor(n))}
    renderTabs();
  }
  inp.onblur=function(){fin(true)};
  inp.onkeydown=function(e){if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false)};
}
function download(){
  var f=curFile(),b=new Blob([fileCode(f)],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}
function renderTabs(){
  var box=$('ftabs');box.innerHTML='';var L=LANGS[lang];
  L.files.forEach(function(f,i){
    var t=document.createElement('div');t.className='ft'+(i===active[lang]?' on':'');
    var nm=document.createElement('span');nm.textContent=f.name;nm.title='Двойной щелчок — переименовать';
    nm.ondblclick=function(e){e.stopPropagation();rename(i,nm)};
    t.onclick=function(){if(i!==active[lang])openFile(i)};
    t.appendChild(nm);
    if(L.files.length>1){var x=document.createElement('b');x.textContent='×';x.title='Закрыть';x.onclick=function(e){e.stopPropagation();closeFile(i)};t.appendChild(x)}
    box.appendChild(t);
  });
  var p=document.createElement('button');p.className='ft add';p.textContent='+';p.title='Новый файл';p.onclick=addFile;box.appendChild(p);
  var h=document.createElement('span');h.className='hint';h.textContent='Ctrl + Enter — запуск';box.appendChild(h);
  var d=document.createElement('button');d.className='ft add';d.textContent='⬇';d.title='Скачать файл';d.onclick=download;box.appendChild(d);
}
document.querySelectorAll('#langs .tab').forEach(function(b){b.onclick=function(){
  lang=b.dataset.l;
  document.querySelectorAll('#langs .tab').forEach(function(x){x.classList.toggle('on',x===b)});
  openFile(active[lang]);applyView();refreshStat();
}});

/* ---------- панель вывода: Терминал / Проблемы ---------- */
function applyView(){
  var h=lang==='html';
  $('otmain').textContent=h?'Предпросмотр':'Терминал';
  document.querySelectorAll('.ot').forEach(function(b){b.classList.toggle('on',b.dataset.t===outTab)});
  wrap.style.display=(outTab==='main'&&!h)?'block':'none';
  frame.style.display=(outTab==='main'&&h)?'block':'none';
  probsEl.style.display=outTab==='probs'?'block':'none';
  $('row').style.display=lang==='python'?'flex':'none';
}
document.querySelectorAll('.ot').forEach(function(b){b.onclick=function(){outTab=b.dataset.t;applyView()}});

var problems=[];
function lastLine(s){var L=String(s).split('\n').filter(Boolean);return L[L.length-1]||String(s)}
function addProblem(msg,line,file){problems.push({msg:lastLine(msg),line:line||null,file:file||runFile});renderProbs()}
function renderProbs(){
  probsEl.innerHTML='';
  if(!problems.length){var n=document.createElement('div');n.className='pnone';n.textContent='Проблем нет.';probsEl.appendChild(n)}
  problems.forEach(function(p){
    var d=document.createElement('div');d.className='pi';
    var i=document.createElement('i');i.textContent='●';
    var s=document.createElement('span');s.textContent=p.file+(p.line?':'+p.line:'')+' — '+p.msg;
    d.appendChild(i);d.appendChild(s);
    d.onclick=function(){
      var L=LANGS[lang],k=L.files.findIndex(function(f){return f.name===p.file});
      if(k>-1){if(k!==active[lang])openFile(k);if(p.line){aceEd.gotoLine(p.line,0,true)}aceEd.focus()}
    };
    probsEl.appendChild(d);
  });
  var c=$('pc');c.textContent=problems.length;c.className=problems.length?'bad':'';
  annotate();
}
function annotate(){
  var f=curFile();
  aceEd.session.setAnnotations(problems.filter(function(p){return p.file===f.name&&p.line}).map(function(p){return {row:p.line-1,column:0,text:p.msg,type:'error'}}));
}
function lastNum(re,s){var m,r=null,g=new RegExp(re.source,'g');while((m=g.exec(s)))r=+m[1];return r}

/* ---------- терминал ---------- */
var mode='loading',pending=null,hist=[],hi=0,engine=null,pyLoading=false,runFile='';
function write(s,c){var sp=document.createElement('span');if(c)sp.className=c;sp.textContent=s;out.appendChild(sp);wrap.scrollTop=wrap.scrollHeight}
function print(s,c){write(s+'\n',c)}
function fmt(v){if(typeof v==='string')return v;try{return typeof v==='object'?JSON.stringify(v):String(v)}catch(e){return String(v)}}
var STAT={loading:'загрузка Python…',running:'выполняется…',input:'ожидание ввода',idle:'готово',failed:'Python не загружен'};
function refreshStat(){
  if(lang!=='python'){$('stat').textContent='';return}
  var t=STAT[mode];
  if(engine==='pyodide')t+=' · Pyodide';
  else if(engine==='skulpt')t+=' · Skulpt'+(pyLoading?' (Pyodide грузится…)':'');
  $('stat').textContent=t;
}
function setMode(m){
  mode=m;ti.disabled=(m!=='idle'&&m!=='input');
  if(m!=='input')ps.textContent=(m==='idle')?'>>> ':'';
  refreshStat();
  if(m==='idle'||m==='input')ti.focus({preventScroll:true});
}
wrap.addEventListener('click',function(){if(!ti.disabled)ti.focus()});
ti.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    var t=ti.value;ti.value='';
    if(mode==='input'&&pending){print(pending.p+t);var r=pending.res;pending=null;ps.textContent='';setMode('running');r(t)}
    else if(mode==='idle'){print('>>> '+t,'m');if(t.trim()){hist.push(t);hi=hist.length;if(engine==='pyodide')execPy(t,true);else execSk(t,true)}}
  }else if(e.key==='Escape'&&mode==='input'&&pending){
    var q=pending;pending=null;ps.textContent='';setMode('running');q.rej(new Error('EOFError: ввод прерван'));
  }else if(e.key==='ArrowUp'&&mode==='idle'){e.preventDefault();if(hi>0){hi--;ti.value=hist[hi]}}
  else if(e.key==='ArrowDown'&&mode==='idle'){e.preventDefault();if(hi<hist.length-1){hi++;ti.value=hist[hi]}else{hi=hist.length;ti.value=''}}
});
function ainput(p){
  return new Promise(function(res,rej){
    p=p==null?'':String(p);pending={res:res,rej:rej,p:p};
    mode='input';ps.textContent=p;ti.disabled=false;ti.focus();refreshStat();
  });
}
function timeout(p,ms,msg){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error(msg))},ms)})])}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('не удалось скачать '+src))};document.head.appendChild(s)})}
function otherPyFiles(){var cf=curFile();return LANGS.python.files.filter(function(f){return f!==cf&&/\.py$/i.test(f.name)})}

/* ---------- Skulpt ---------- */
var SK_SRC=[
 ['https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt.min.js','https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt-stdlib.js'],
 ['https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js','https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js']
];
function skRead(x){
  if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[x]===undefined)throw "File not found: '"+x+"'";
  return Sk.builtinFiles.files[x];
}
async function initSkulpt(){
  for(var k=0;k<SK_SRC.length&&!engine;k++){
    try{
      if(!window.Sk){await timeout(loadScript(SK_SRC[k][0]),30000,'таймаут skulpt');await timeout(loadScript(SK_SRC[k][1]),30000,'таймаут skulpt-stdlib')}
      engine='skulpt';
    }catch(e){print('Skulpt: '+(e&&e.message||e),'e')}
  }
}
async function execSk(src,repl){
  setMode('running');
  try{
    Sk.configure({output:function(s){write(s)},read:skRead,inputfun:function(p){return ainput(p)},inputfunTakesPrompt:true,__future__:Sk.python3});
    otherPyFiles().forEach(function(f){Sk.builtinFiles.files['src/lib/'+f.name]=fileCode(f)});
    await Sk.misceval.asyncToPromise(function(){return Sk.importMainWithBody('<stdin>',false,src,true)});
  }catch(e){
    var m=String(e&&e.toString?e.toString():e);print(m,'e');
    if(!repl)addProblem(m,lastNum(/on line (\d+)/,m));
  }
  finally{pending=null;setMode('idle')}
}

/* ---------- Pyodide ---------- */
var py=null,ns=null,trFn=null,reprFn=null;
var SOURCES=['https://cdn.jsdelivr.net/npm/pyodide@0.26.4/','https://unpkg.com/pyodide@0.26.4/','https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'];
var HELPER=String.raw`
import ast, builtins, jsio
builtins._ainput_ = jsio.ainput
def _no_sync_input(*a):
    raise RuntimeError("input() здесь не поддерживается (например, внутри lambda или __init__). Вызывайте input() на верхнем уровне или в обычной функции.")
builtins.input = _no_sync_input
def _fname(f):
    if isinstance(f, ast.Name): return f.id
    if isinstance(f, ast.Attribute): return f.attr
def _tr_(src):
    tree = ast.parse(src)
    defs = [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name != '__init__']
    fs = set()
    def needs(d):
        for n in ast.walk(d):
            if isinstance(n, ast.Call):
                f = n.func
                if (isinstance(f, ast.Name) and f.id == 'input') or _fname(f) in fs:
                    return True
        return False
    ch = True
    while ch:
        ch = False
        for d in defs:
            if d.name not in fs and needs(d):
                fs.add(d.name); ch = True
    class T(ast.NodeTransformer):
        def visit_Call(self, n):
            self.generic_visit(n)
            f = n.func
            if isinstance(f, ast.Name) and f.id == 'input':
                n.func = ast.Name('_ainput_', ast.Load())
                return ast.Await(n)
            if _fname(f) in fs:
                return ast.Await(n)
            return n
        def visit_FunctionDef(self, n):
            self.generic_visit(n)
            if n.name in fs:
                n.__class__ = ast.AsyncFunctionDef
            return n
    tree = T().visit(tree)
    ast.fix_missing_locations(tree)
    return ast.unparse(tree)
`;
function clean(m){
  var L=String(m).split('\n'),i=L.findIndex(function(l){return l.indexOf('"<exec>"')>-1});
  if(i>-1)return 'Traceback (most recent call last):\n'+L.slice(i).join('\n');
  return L.filter(Boolean).slice(-3).join('\n');
}
function newNs(){if(ns)ns.destroy();ns=py.runPython('{"__name__": "__main__"}')}
async function initPyodide(){
  pyLoading=true;refreshStat();var loaded=null;
  for(var k=0;k<SOURCES.length&&!loaded;k++){
    var base=SOURCES[k];
    try{
      if(!window.loadPyodide)await timeout(loadScript(base+'pyodide.js'),30000,'таймаут pyodide.js');
      loaded=await timeout(loadPyodide({indexURL:base}),180000,'таймаут загрузки');
    }catch(e){loaded=null}
  }
  try{
    if(!loaded)throw new Error('источники недоступны');
    py=loaded;
    py.setStdout({batched:function(s){print(s)}});
    py.setStderr({batched:function(s){print(s,'e')}});
    py.registerJsModule('jsio',{ainput:ainput});
    py.runPython(HELPER);
    trFn=py.globals.get('_tr_');reprFn=py.runPython('repr');newNs();engine='pyodide';
    print('Pyodide загружен: теперь работает полный Python '+py.runPython('import sys\nsys.version.split()[0]')+' (REPL запоминает переменные).','m');
  }catch(e){
    py=null;
    if(engine==='skulpt')print('Pyodide не загрузился ('+(e&&e.message||e)+'). Работает облегчённый Python (Skulpt): без numpy/pandas и части модулей.','m');
  }
  pyLoading=false;refreshStat();
}
function syncPyFiles(){
  var o=otherPyFiles();
  o.forEach(function(f){py.FS.writeFile('/home/pyodide/'+f.name,fileCode(f))});
  py.runPython('import sys, importlib\nimportlib.invalidate_caches()\nfor m in '+JSON.stringify(o.map(function(f){return f.name.replace(/\.py$/i,'')}))+':\n    sys.modules.pop(m, None)');
}
async function execPy(src,repl){
  setMode('running');
  try{
    if(!repl)syncPyFiles();
    var r=await py.runPythonAsync(trFn(src),{globals:ns});
    if(repl&&r!==undefined)print(String(reprFn(r)));
  }catch(e){
    var c=clean(e.message||e);print(c,'e');
    if(!repl)addProblem(c,lastNum(/line (\d+)/,c));
  }
  finally{pending=null;setMode('idle')}
}

/* ---------- запуск Python ---------- */
var starting=false;
async function startPython(){
  if(starting)return;starting=true;setMode('loading');
  if(!engine)print('Загружаю Python…','m');
  await initSkulpt();
  if(engine){
    setMode('idle');
    print('Python готов — нажмите «Запустить» или вводите команды ниже. Полный Python (Pyodide) догружается в фоне…','m');
    if(!py)initPyodide();
  }else{
    await initPyodide();
    if(engine){setMode('idle');print('Python готов.','m')}
    else{setMode('failed');print('Python не загрузился: проверьте интернет, отключите VPN/блокировщик и нажмите «Запустить».','e')}
  }
  starting=false;
}

/* ---------- JavaScript ---------- */
async function runJs(src){
  var j=function(a){return [].map.call(a,fmt).join(' ')};
  var c={log:function(){print(j(arguments))},warn:function(){print(j(arguments),'e')},error:function(){print(j(arguments),'e')}};
  c.info=c.log;
  try{var AF=Object.getPrototypeOf(async function(){}).constructor;var r=await new AF('console',src)(c);if(r!==undefined)print('→ '+fmt(r),'m')}
  catch(e){
    print(String(e),'e');
    var m=/<anonymous>:(\d+):\d+/.exec(String(e&&e.stack||''));
    addProblem(String(e),m?Math.max(1,+m[1]-2):null);
  }
}

/* ---------- HTML ---------- */
var REPORTER='<script>window.addEventListener("error",function(e){parent.postMessage({__p:1,msg:e.message,line:e.lineno},"*")})<\/script>';
function buildHtml(){
  var files=LANGS.html.files,by={};files.forEach(function(f){by[f.name]=fileCode(f)});
  var main=files.find(function(f){return f.name==='index.html'})||files.find(function(f){return /\.html?$/i.test(f.name)})||files[0],cf=curFile();
  if(/\.html?$/i.test(cf.name))main=cf;
  var d=fileCode(main);
  d=d.replace(/<link[^>]*href=["']([^"']+)["'][^>]*>/gi,function(m,h){return by[h]!==undefined?'<style>'+by[h]+'</style>':m});
  d=d.replace(/<script([^>]*?)src=["']([^"']+)["']([^>]*)>\s*<\/script>/gi,function(m,a,h){return by[h]!==undefined?'<script>'+by[h].replace(/<\/script/gi,'<\\/script')+'<\/script>':m});
  return /<head[^>]*>/i.test(d)?d.replace(/<head[^>]*>/i,function(m){return m+REPORTER}):REPORTER+d;
}
window.addEventListener('message',function(e){var d=e.data;if(d&&d.__p&&e.source===frame.contentWindow)addProblem(String(d.msg),null,'предпросмотр')});

/* ---------- кнопка «Запустить» ---------- */
async function run(){
  var f=curFile();runFile=f.name;var src=fileCode(f);
  problems=[];renderProbs();
  if(lang==='html'){frame.srcdoc=buildHtml();return}
  if(lang==='python'){
    if(!engine){
      if(starting)print('Python ещё загружается — подождите несколько секунд.','m');
      else await startPython();
      if(!engine)return;
    }
    if(mode!=='idle'){print('Программа ещё выполняется (Esc — прервать ввод).','m');return}
    out.innerHTML='';
    if(engine==='pyodide'){newNs();await execPy(src,false)}else await execSk(src,false);
    return;
  }
  out.innerHTML='';await runJs(src);
}
$('run').onclick=run;
$('clr').onclick=function(){out.innerHTML='';problems=[];renderProbs();if(lang==='html')frame.srcdoc=''};

openFile(0);applyView();renderProbs();setMode('loading');startPython();
</script>
